name: paper-bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: python paper_bot.py once
      - name: Save paper trades
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
                    for f in paper_state.json paper_trades.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "paper update" && git push)
